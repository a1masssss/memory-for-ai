services:
  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-memory-service}
      DATABASE_URL: ${DATABASE_URL:-postgresql://memory:memory@postgres:5432/memory}
      MEMORY_AUTH_TOKEN: ${MEMORY_AUTH_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build: .
    environment:
      MEMORY_SERVICE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "pip install --no-cache-dir '.[test]' && pytest"

volumes:
  postgres_data:
