services:
  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-memory-service}
      DATABASE_URL: ${DATABASE_URL:-postgresql://memory:memory@postgres:5432/memory}
      MEMORY_AUTH_TOKEN: ${MEMORY_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EXTRACTION_ENABLED: ${OPENAI_EXTRACTION_ENABLED:-true}
      OPENAI_EMBEDDING_ENABLED: ${OPENAI_EMBEDDING_ENABLED:-true}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build: .
    environment:
      APP_NAME: memory-service-test
      DATABASE_URL: postgresql://memory:memory@postgres:5432/memory
      MEMORY_SERVICE_URL: http://127.0.0.1:8080
      OPENAI_EXTRACTION_ENABLED: "false"
      OPENAI_EMBEDDING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir '.[test]' &&
             (uvicorn app.main:app --host 0.0.0.0 --port 8080 &) &&
             pytest"

volumes:
  postgres_data:
